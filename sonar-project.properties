sonar.projectKey=Markosuuu_desarrollo-de-aplicaciones-2026s2
sonar.organization=pronta-entrega

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=frontend/src,backend/src/main/java
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,frontend/src/tests/**

# Tests
sonar.tests=frontend/src/tests,backend/src/test/java

# Java
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# JavaScript
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
