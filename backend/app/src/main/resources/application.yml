server:
  port: 8080

spring:
  application:
    name: pronta-entrega
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:prontaentrega-dev-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    org.springframework.security: INFO
    com.prontaentrega: INFO
