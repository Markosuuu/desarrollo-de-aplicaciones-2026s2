spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: always

jwt:
  secret: test-secret-key-1234567890-abcdefghijklmnop
  expiration-ms: 3600000