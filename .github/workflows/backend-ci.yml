name: Backend - CI - Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

# Cancela corridas viejas del mismo evento y rama (nunca en main)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ./backend

jobs:
  # Siempre: cualquier push y cualquier PR (a dev o main)
  model-tests:
    name: Tests de modelo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a #v4

      - name: Tests de modelo
        run: ./gradlew test

  # Push a dev/main, o cualquier PR (a dev o main)
  integration-tests:
    name: Tests de integración
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a #v4

      - name: Tests de integración
        run: ./gradlew integrationTest

  # Push a main, o PR hacia main (desde cualquier rama)
  e2e-tests:
    name: Tests e2e
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a #v4

      - name: Tests e2e
        run: ./gradlew e2eTest
